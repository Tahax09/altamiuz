# Clean, throwaway environment for the restore drill (ops/restore-drill.sh, SC-013). Data lives in
# tmpfs: nothing survives `down`, and nothing is shared with the development database.
name: altamiuz-drill
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: drill
      POSTGRES_DB: drill
      POSTGRES_PASSWORD: ${DRILL_PG_PASSWORD:?set by ops/restore-drill.sh}
    ports:
      - '127.0.0.1:${DRILL_PG_PORT:-54329}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drill -d drill']
      interval: 2s
      timeout: 3s
      retries: 30
